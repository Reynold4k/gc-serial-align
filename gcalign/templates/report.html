<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="{{GENERATOR}}">
<title>{{TITLE}}</title>
<style>
{{FONTS}}
:root{ {{CSS_VARS}} color-scheme: dark; }
*{ box-sizing: border-box; }
html{ background: var(--bg); }
body{ margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
      font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv11", "ss01"; }
main{ max-width: 1120px; margin: 0 auto; padding: 56px 24px 72px; }
header{ margin-bottom: 40px; }
.eyebrow{ color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 10px; }
h1{ font-size: 30px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; margin: 0 0 10px; word-break: break-word; }
.lead{ color: var(--ink-2); font-size: 15.5px; margin: 0; max-width: 820px; }
h2{ font-size: 19px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.005em; }
h3{ font-size: 14px; font-weight: 500; color: var(--ink-2); margin: 26px 0 8px; }
section{ padding: 40px 0 8px; border-top: 1px solid var(--line); margin-top: 32px; }
section > p{ color: var(--ink-2); margin: 0 0 18px; max-width: 760px; }
figure{ margin: 18px 0 8px; }
figure img{ display: block; width: 100%; height: auto; }
figure.narrow img{ max-width: 560px; margin: 0 auto; }
.tiles{ display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile{ background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px 15px; }
.tile .label{ color: var(--ink-2); font-size: 12.5px; margin: 0 0 6px; }
.tile .value{ font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin: 0; line-height: 1.15; }
.tile .value small{ font-size: 14px; font-weight: 400; color: var(--ink-2); margin-left: 3px; }
.tile .sub{ color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.scroll{ overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 6px 0 4px; }
table{ border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td{ padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th{ color: var(--muted); font-weight: 500; font-size: 12px; line-height: 1.35; white-space: normal;
    vertical-align: bottom; min-width: 64px; border-bottom-color: var(--line-2); }
table.compact{ max-width: 760px; }
table.compact td:first-child{ white-space: normal; color: var(--ink-2); }
th:first-child, td:first-child{ text-align: left; padding-left: 0; }
td.text, th.text{ text-align: left; }
tbody tr:last-child td{ border-bottom: none; }
.kind-IF{ color: var(--if); font-weight: 500; }
.kind-ST{ color: var(--st); font-weight: 500; }
.dim{ color: var(--muted); }
.flag{ color: var(--warn); }
ul.caveats{ margin: 0; padding: 0; list-style: none; }
ul.caveats li{ color: var(--ink-2); padding: 12px 0 12px 22px; border-bottom: 1px solid var(--line); position: relative; max-width: 860px; }
ul.caveats li::before{ content: ""; position: absolute; left: 2px; top: 21px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
ul.caveats li:last-child{ border-bottom: none; }
.note{ color: var(--muted); font-size: 13px; margin: 10px 0 0; }
footer{ margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
code{ font-family: var(--mono); font-size: 13px; color: var(--ink); }
footer code{ font-family: var(--mono); font-size: 12px; color: var(--ink-2); word-break: break-all; }
@media (max-width: 640px){
  main{ padding: 36px 16px 56px; }
  h1{ font-size: 24px; }
  .tile .value{ font-size: 22px; }
}
</style>
</head>
<body>
<main>
{{CONTENT}}
</main>
</body>
</html>
